name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate VERSION
        id: version
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION file does not contain a valid X.Y.Z version: '$v'" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Skip if a release for this version already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git log -1 --format=%s)
          if [[ "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+ ]]; then
            subject=$(git log -1 --format=%b | sed -n '/./p' | head -1)
          fi
          gh release create "${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }} — ${subject}" \
            --generate-notes
